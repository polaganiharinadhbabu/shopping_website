<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Online Store</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
<h1 id="sn">My Store</h1>
<input id="q" type="search" placeholder="Search products" aria-label="Search products">
<button class="hb on" data-t="shop">Shop</button>
<button class="hb" data-t="admin">Admin</button>
<button class="hb" data-a="cart" id="cb">Cart (0)</button>
</header>
<div class="wrap"><main id="main"></main></div>
<div id="ov"><div id="dr" role="dialog" aria-label="Cart"></div></div>

<script src="script.js" defer></script>
</body>
</html>
